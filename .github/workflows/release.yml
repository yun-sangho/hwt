name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun scripts/build.ts --all
      - run: gh release create "$GITHUB_REF_NAME" dist/hwt-* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
